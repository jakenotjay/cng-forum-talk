<script>
// Slide 6: the travel clock counts 0:00 → 8:20 while the photon crosses.
// The timing lives only in custom.scss: this starts when the photon-head CSS
// animation starts and reads that animation's duration, so the two stay in step.
(function () {
  'use strict';

  var TRIP_SECONDS = 500;  // 8 min 20 s, Sun to Earth at the speed of light
  var raf = 0;

  function fmt(s) {
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  document.addEventListener('animationstart', function (e) {
    if (e.animationName !== 'photon-head') return;
    var clock = e.target.closest('section').querySelector('.trip-clock');
    var ms = parseFloat(getComputedStyle(e.target).animationDuration) * 1000;
    var t0 = performance.now();

    function frame(now) {
      var p = Math.min(1, Math.max(0, (now - t0) / ms));
      clock.textContent = fmt(p * TRIP_SECONDS);
      raf = p < 1 ? requestAnimationFrame(frame) : 0;
    }

    cancelAnimationFrame(raf);
    clock.textContent = fmt(0);
    raf = requestAnimationFrame(frame);
  });

  // Land exactly on 8:20 even if frames were throttled along the way
  document.addEventListener('animationend', function (e) {
    if (e.animationName !== 'photon-head') return;
    cancelAnimationFrame(raf);
    raf = 0;
    e.target.closest('section').querySelector('.trip-clock').textContent = fmt(TRIP_SECONDS);
  });
})();
</script>

<script>
// Slide 20: the A-B-C-D dependency graph from slide 12 keeps growing.
// Starts when the slide becomes current and stops when the deck moves on,
// so it replays on every visit and stays in step with the CSS-timed text.
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var YELLOW = '#FFD626';
  var FAMILY_COLORS = ['#4a7fd8', '#e07040', '#5bb58a', '#e3a83a', '#e088a8', '#4f9a35', '#7a6ad6', '#e0595a'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Match the canvas backing store to Reveal's scale and the screen density
  function fitCanvas(canvas, w, h) {
    var s = (Reveal.getScale ? Reveal.getScale() : 1) * (window.devicePixelRatio || 1);
    canvas.width = Math.round(w * s);
    canvas.height = Math.round(h * s);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    return ctx;
  }

  function growNetwork(slide) {
    var canvas = slide.querySelector('canvas.grow-network');
    var W = 1600, H = 900;
    var FOCUS = { x: 800, y: 370, w: 1440, h: 600 };  // screen region the network fits into
    var MAX_NODES = 260;
    var ctx, raf = 0, t0 = 0, rng, nodes, links, cam, nextSpawn;

    function addNode(x, y, label, color, born) {
      nodes.push({ x: x, y: y, vx: 0, vy: 0, label: label, color: color, deg: 0, born: born });
      return nodes.length - 1;
    }

    function link(a, b) {
      links.push([a, b]);
      nodes[a].deg++;
      nodes[b].deg++;
    }

    function reset(now) {
      rng = mulberry32(20);
      nodes = [];
      links = [];
      addNode(140, 0, 'A', null, now);
      addNode(0, -55, 'B', null, now);
      addNode(0, 60, 'C', null, now);
      addNode(-140, -55, 'D', null, now);
      link(0, 1);
      link(1, 3);
      link(0, 2);
      cam = { x: 0, y: 0, s: 2 };
      nextSpawn = 800;
    }

    function spawn(born) {
      // Preferential attachment: well-connected nodes collect more dependents
      var total = 0, i;
      for (i = 0; i < nodes.length; i++) total += nodes[i].deg + 1;
      var r = rng() * total, parent = 0;
      for (i = 0; i < nodes.length; i++) {
        r -= nodes[i].deg + 1;
        if (r <= 0) { parent = i; break; }
      }
      var p = nodes[parent], a = rng() * TAU;
      var color = FAMILY_COLORS[Math.floor(rng() * FAMILY_COLORS.length)];
      var n = addNode(p.x + Math.cos(a) * 40, p.y + Math.sin(a) * 40, null, color, born);
      link(parent, n);

      // Sometimes also depend on the nearest other node, which turns the tree into a web
      if (nodes.length > 8 && rng() < 0.3) {
        var best = -1, bestD = Infinity;
        for (i = 0; i < n; i++) {
          if (i === parent) continue;
          var dx = nodes[i].x - nodes[n].x, dy = nodes[i].y - nodes[n].y, dd = dx * dx + dy * dy;
          if (dd < bestD) { bestD = dd; best = i; }
        }
        if (best >= 0) link(n, best);
      }
    }

    function tick() {
      var n = nodes.length, i, j, a, b, dx, dy, d2, d, f;
      for (i = 0; i < n; i++) {
        a = nodes[i];
        for (j = i + 1; j < n; j++) {
          b = nodes[j];
          dx = b.x - a.x; dy = b.y - a.y;
          d2 = dx * dx + dy * dy + 0.01;
          if (d2 > 90000) continue;
          d = Math.sqrt(d2);
          f = 2400 / d2;
          a.vx -= dx / d * f; a.vy -= dy / d * f;
          b.vx += dx / d * f; b.vy += dy / d * f;
        }
      }
      for (i = 0; i < links.length; i++) {
        a = nodes[links[i][0]]; b = nodes[links[i][1]];
        dx = b.x - a.x; dy = b.y - a.y;
        d = Math.sqrt(dx * dx + dy * dy) || 1;
        f = (d - 48) * 0.04;
        a.vx += dx / d * f; a.vy += dy / d * f;
        b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
      for (i = 0; i < n; i++) {
        a = nodes[i];
        a.vx = (a.vx - a.x * 0.0015) * 0.82;
        a.vy = (a.vy - a.y * 0.0015) * 0.82;
        a.x += Math.max(-8, Math.min(8, a.vx));
        a.y += Math.max(-8, Math.min(8, a.vy));
      }
    }

    function updateCamera() {
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodes.forEach(function (nd) {
        if (nd.x < minX) minX = nd.x;
        if (nd.x > maxX) maxX = nd.x;
        if (nd.y < minY) minY = nd.y;
        if (nd.y > maxY) maxY = nd.y;
      });
      var target = Math.min(FOCUS.w / (maxX - minX + 80), FOCUS.h / (maxY - minY + 80), 2);
      cam.s += (target - cam.s) * 0.04;
      cam.x += ((minX + maxX) / 2 - cam.x) * 0.04;
      cam.y += ((minY + maxY) / 2 - cam.y) * 0.04;
    }

    function sx(x) { return FOCUS.x + (x - cam.x) * cam.s; }
    function sy(y) { return FOCUS.y + (y - cam.y) * cam.s; }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);

      ctx.beginPath();
      links.forEach(function (l) {
        ctx.moveTo(sx(nodes[l[0]].x), sy(nodes[l[0]].y));
        ctx.lineTo(sx(nodes[l[1]].x), sy(nodes[l[1]].y));
      });
      ctx.strokeStyle = 'rgba(242,244,246,0.18)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      var zoom = Math.max(0.6, Math.min(1.4, cam.s));
      nodes.forEach(function (nd) {
        var x = sx(nd.x), y = sy(nd.y), grow = Math.min(1, (now - nd.born) / 450), r;
        if (nd.label) {
          r = Math.max(11, 22 * cam.s / 2);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fillStyle = 'rgba(255,214,38,0.08)';
          ctx.fill();
          ctx.strokeStyle = YELLOW;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = '#F2F4F6';
          ctx.font = '700 ' + Math.round(r) + 'px "iA Writer Quattro S", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(nd.label, x, y + 1);
        } else {
          r = (3 + Math.min(nd.deg, 8) * 0.5) * zoom * grow;
          if (grow < 1) {
            ctx.beginPath();
            ctx.arc(x, y, r + (1 - grow) * 16, 0, TAU);
            ctx.strokeStyle = 'rgba(242,244,246,' + (0.5 * (1 - grow)) + ')';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(x, y, Math.max(0.5, r), 0, TAU);
          ctx.fillStyle = nd.color;
          ctx.fill();
        }
      });
    }

    function frame(now) {
      var t = now - t0;
      // Spawn faster and faster: every ~240 ms at first, ~50 ms by the end.
      // Birth times use the schedule, so a late frame doesn't hatch a burst at once.
      while (t >= nextSpawn && nodes.length < MAX_NODES && t < 14500) {
        spawn(t0 + nextSpawn);
        nextSpawn += 240 - 190 * Math.min(1, t / 13000);
      }
      tick();
      tick();
      updateCamera();
      draw(now);
      raf = requestAnimationFrame(frame);
    }

    return {
      start: function () {
        ctx = fitCanvas(canvas, W, H);
        t0 = performance.now();
        reset(t0);
        raf = requestAnimationFrame(frame);
      },
      stop: function () {
        cancelAnimationFrame(raf);
        raf = 0;
      },
      resize: function () {
        ctx = fitCanvas(canvas, W, H);
      }
    };
  }

  function init() {
    var slide = document.getElementById('slide-20');
    if (!slide) return;
    var scene = growNetwork(slide), running = false;

    function show(current) {
      if (running) scene.stop();
      running = current === slide;
      if (running) scene.start();
    }

    Reveal.on('slidechanged', function (e) { show(e.currentSlide); });
    Reveal.on('resize', function () { if (running) scene.resize(); });
    show(Reveal.getCurrentSlide());
  }

  function boot() {
    if (Reveal.isReady()) init();
    else Reveal.on('ready', init);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
