[project]
name = "cng-utah-deck-scripts"
version = "0.1.0"
description = "Visual generators and verification for the CNG Utah deck"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "numpy>=2",
    "shapely>=2",
    "pyproj>=3.6",
    "odc-geo>=0.4",
    "playwright>=1.47",
    "qrcode>=8",
    "pymupdf>=1.24",
    "matplotlib>=3.9",
]
